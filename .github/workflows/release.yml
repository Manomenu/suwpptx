name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CI: "1"
  NODE_VERSION: 24.11.0

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Build both zips
        run: |
          bash scripts/.internal/package.sh win-x64
          bash scripts/.internal/package.sh linux-x64
      - name: Publish the release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .artifacts/release/suwpptx-win-x64.zip \
            .artifacts/release/suwpptx-linux-x64.zip \
            install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
