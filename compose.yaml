# The whole stack on a laptop, from the same Dockerfiles as production. Every value comes from the environment
# (.env, see .env.example) with the ASP.NET names (Section__Key); the defaults here make a bare `docker compose up`
# work. The app has no database: it works on one folder of the host (SUWPPTX_ROOT, default ~/suwpptx) mounted at
# /data (:Z relabels it for SELinux hosts; Docker without SELinux ignores it). Only web publishes a port, and only on
# localhost: the app has no login.
name: suwpptx

services:
  server:
    image: suwpptx-server:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Suwpptx.Server/Dockerfile
    # Runs as the host user, not the image's: files the server writes into the mounted folder then belong to the
    # owner, who keeps opening and editing them outside the app. UID and GID are not exported by most shells: set
    # them in .env when yours are not 1000. Rootless Podman maps the host user to root inside the container, so
    # there the host UID cannot read the mount: set SERVER_USER=0:0 in .env (root in the container is you on the host).
    user: "${SERVER_USER:-${UID:-1000}:${GID:-1000}}"
    environment:
      Folder__Root: /data
    volumes:
      - ${SUWPPTX_ROOT:-${HOME}/suwpptx}:/data:Z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6310/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s


